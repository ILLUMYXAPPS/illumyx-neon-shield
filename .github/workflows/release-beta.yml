name: Release Neon Shield v2.0-beta

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            asset: ILLUMYX-Neon-Shield-Windows.zip
          - os: macos-latest
            label: macOS
            asset: ILLUMYX-Neon-Shield-macOS.zip

    steps:
      - name: Check out shipping commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: cc7cc0334c45d32fc769bcc305659349fef525db

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build desktop app
        run: pyinstaller --clean NeonShield.spec

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ILLUMYX-Neon-Shield.exe -DestinationPath ILLUMYX-Neon-Shield-Windows.zip

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/ILLUMYX-Neon-Shield ILLUMYX-Neon-Shield-macOS.zip

      - name: Upload packaged build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.label }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish v2.0-beta
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Create beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0-beta \
            ILLUMYX-Neon-Shield-Windows.zip \
            ILLUMYX-Neon-Shield-macOS.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target cc7cc0334c45d32fc769bcc305659349fef525db \
            --title "ILLUMYX Neon Shield v2.0-beta" \
            --prerelease \
            --notes $'ILLUMYX Neon Shield v2.0-beta\n\nFirst public beta of the redesigned local-first desktop security posture dashboard.\n\nHighlights:\n- Cyber-neon ILLUMYX desktop interface\n- Local firewall and device posture reporting\n- Windows Defender status reporting on Windows\n- Guided recommendations and local text-report export\n- Defensive, read-only checks with safe failure handling\n- Automated cross-platform tests\n- Packaged Windows and macOS builds\n\nPrivacy: Neon Shield performs local checks only. It does not collect credentials, scan remote devices, or transmit displayed device information to a remote service.\n\nBeta note: platform-specific desktop behaviour should still be tested on representative user machines before a stable release.'
