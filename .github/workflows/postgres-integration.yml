name: Neon Shield PostgreSQL Integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    name: PostgreSQL 16 concurrency and persistence
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neon
          POSTGRES_PASSWORD: neon
          POSTGRES_DB: neon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neon -d neon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEON_TEST_DATABASE_URL: postgresql://neon:neon@localhost:5432/neon_test
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "psycopg[binary]>=3.2,<4"

      - name: Compile managed database adapter and integration tests
        run: python -m py_compile backend/managed_db_store.py backend/managed_db_postgres_integration_test.py

      - name: Run real PostgreSQL integration and concurrency tests
        run: python -m unittest -v backend.managed_db_postgres_integration_test
