name: Neon Shield Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-cross-platform:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app_ui.py security_checks.py auth_server_contract.py auth_server.py neon_forensics.py neon_forensics_vault.py platform_collectors.py windows_wfp_telemetry.py backend tests

      - name: Run application unit tests
        run: python -m unittest discover -s tests -v

      - name: Run production configuration boundary tests
        run: python -m unittest -v backend.production_config_test

      - name: Run device pairing security and lifecycle tests
        run: python -m unittest -v backend.device_pairing_test backend.managed_db_store_hardening_test

      - name: Run monitoring hardening tests
        run: >-
          python -m unittest -v
          backend.observability_test
          backend.composition_test
          backend.security_monitoring_test

  # One macOS job requests one hosted runner and validates both supported
  # Python versions sequentially. This avoids two queued matrix jobs competing
  # for hosted macOS runner capacity while retaining the full test coverage.
  test-macos:
    name: Python 3.10 and 3.12 sequentially on macOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install Python 3.10 runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources with 3.10
        run: python -m compileall -q app_ui.py security_checks.py auth_server_contract.py auth_server.py neon_forensics.py neon_forensics_vault.py platform_collectors.py windows_wfp_telemetry.py backend tests

      - name: Run application unit tests with 3.10
        run: python -m unittest discover -s tests -v

      - name: Run production configuration boundary tests with 3.10
        run: python -m unittest -v backend.production_config_test

      - name: Run device pairing security and lifecycle tests with 3.10
        run: python -m unittest -v backend.device_pairing_test backend.managed_db_store_hardening_test

      - name: Run monitoring hardening tests with 3.10
        run: >-
          python -m unittest -v
          backend.observability_test
          backend.composition_test
          backend.security_monitoring_test

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Python 3.12 runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources with 3.12
        run: python -m compileall -q app_ui.py security_checks.py auth_server_contract.py auth_server.py neon_forensics.py neon_forensics_vault.py platform_collectors.py windows_wfp_telemetry.py backend tests

      - name: Run application unit tests with 3.12
        run: python -m unittest discover -s tests -v

      - name: Run production configuration boundary tests with 3.12
        run: python -m unittest -v backend.production_config_test

      - name: Run device pairing security and lifecycle tests with 3.12
        run: python -m unittest -v backend.device_pairing_test backend.managed_db_store_hardening_test

      - name: Run monitoring hardening tests with 3.12
        run: >-
          python -m unittest -v
          backend.observability_test
          backend.composition_test
          backend.security_monitoring_test
