name: Neon Shield Tests

on:
  push:
    branches: [main, "agent/**", "feat/**"]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app_ui.py security_checks.py auth_server_contract.py auth_server.py neon_forensics.py neon_forensics_vault.py platform_collectors.py windows_wfp_telemetry.py backend tests

      - name: Run application unit tests
        run: python -m unittest discover -s tests -v

      - name: Run monitoring hardening tests
        run: >-
          python -m unittest -v
          backend.observability_test
          backend.composition_test
          backend.security_monitoring_test
