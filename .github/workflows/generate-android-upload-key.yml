name: Android Upload Key Generation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  disabled:
    name: Disabled secure-key workflow
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unsafe CI key generation
        shell: bash
        run: |
          set -euo pipefail
          echo 'Android upload-key generation is intentionally disabled in CI.'
          echo 'Private signing keys must be generated and retained outside GitHub Actions.'
          echo 'After local generation, store only the required signing values in protected GitHub Actions Secrets.'
          exit 1
