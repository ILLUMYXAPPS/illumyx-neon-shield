name: PostgreSQL Audit-Chain Integration

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/postgres-audit-integration.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/postgres-audit-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-audit-integration:
    name: PostgreSQL 16 concurrency and rollback tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neon_test
          POSTGRES_PASSWORD: neon_test_only
          POSTGRES_DB: neon_shield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neon_test -d neon_shield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEON_SHIELD_TEST_DATABASE_URL: postgresql://neon_test:neon_test_only@localhost:5432/neon_shield_test
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography "psycopg[binary]>=3.2,<4"

      - name: Compile integration test and production database code
        run: >-
          python -m compileall -q
          backend/migrations.py
          backend/production_migrations.py
          backend/serialized_audit_store.py
          backend/postgres_audit_integration_test.py

      - name: Run real PostgreSQL migration, concurrency, and rollback tests
        run: python -m unittest backend.postgres_audit_integration_test -v
