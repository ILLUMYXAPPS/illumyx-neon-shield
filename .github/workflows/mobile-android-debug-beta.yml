name: Neon Shield Android Debug-Signed Beta

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-debug-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-debug-beta:
    name: Build and verify debug-signed Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: mobile
        run: flutter create --platforms=android --org com.illumyx --project-name illumyxapp .

      - name: Set Android compile SDK required by dependencies
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          candidates = (
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          )
          gradle_file = next((path for path in candidates if path.is_file()), None)
          if gradle_file is None:
              raise SystemExit("Flutter did not generate an Android app Gradle file.")

          content = gradle_file.read_text()
          replacements = (
              ("compileSdk = flutter.compileSdkVersion", "compileSdk = 36"),
              ("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36"),
              ("compileSdkVersion = flutter.compileSdkVersion", "compileSdkVersion = 36"),
          )
          for old, new in replacements:
              if old in content:
                  content = content.replace(old, new, 1)
                  break
          else:
              if not any(token in content for token in ("compileSdk = 36", "compileSdkVersion 36", "compileSdkVersion = 36")):
                  raise SystemExit(f"Could not safely set compile SDK in {gradle_file}.")

          gradle_file.write_text(content)
          print(f"Configured Android compile SDK 36 in {gradle_file}")
          PY

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Build debug-signed APK
        working-directory: mobile
        run: flutter build apk --debug --build-name=1.0.0-beta.1 --build-number=1

      - name: Verify APK exists, package ID, and debug signature
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" dump badging "$APK" | grep -F "package: name='com.illumyx.illumyxapp'"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload debug-signed Android beta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ILLUMYX-Neon-Shield-Android-debug-signed-beta
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90
