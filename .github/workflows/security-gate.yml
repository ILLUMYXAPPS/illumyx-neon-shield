name: Neon Shield Security Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    name: Security regression suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile security-sensitive Python sources
        run: >-
          python -m compileall -q
          auth_server.py auth_server_contract.py security_checks.py tests

      - name: Run authentication and security tests
        run: >-
          python -m unittest discover -s tests -v

      - name: Reject obvious private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!*.md'; then
            echo 'Private-key material detected in tracked source files.'
            exit 1
          fi

      - name: Check production safety invariants
        shell: bash
        run: |
          set -euo pipefail

          # Production code must not contain obvious debug-mode assignments.
          # Test fixtures are excluded because they intentionally exercise
          # defensive behavior and may contain invalid/debug values.
          if git grep -n -I -E -- '(^|[^A-Za-z_])(DEBUG|FLASK_DEBUG|DEV_MODE)[[:space:]]*=[[:space:]]*(True|1|"true"|\x27true\x27)([^A-Za-z_]|$)' -- '*.py' '*.dart' ':!tests/**' ':!mobile/test/**'; then
            echo 'Debug mode appears enabled in tracked application source.'
            exit 1
          fi

          # Any plaintext HTTP URL in production application source must be
          # explicitly local-only. Test fixtures are excluded because they
          # intentionally exercise rejection of insecure endpoints.
          # Keeping the rule broad prevents a newly named API from bypassing it.
          if git grep -n -I -E -- 'http://[^[:space:]"'"'"'<>]+' -- '*.py' '*.dart' ':!tests/**' ':!mobile/test/**' | grep -vE 'http://(localhost|127\.0\.0\.1)(:|/)' ; then
            echo 'Non-local plaintext HTTP endpoint detected in production application source.'
            exit 1
          fi

          echo 'Production safety invariants passed.'
