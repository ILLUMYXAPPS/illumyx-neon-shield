name: Neon Shield Security Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    name: Security regression suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile security-sensitive Python sources
        run: >-
          python -m compileall -q
          auth_server.py auth_server_contract.py security_checks.py tests

      - name: Run authentication and security tests
        run: >-
          python -m unittest discover -s tests -v

      - name: Reject obvious private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!*.md'; then
            echo 'Private-key material detected in tracked source files.'
            exit 1
          fi
