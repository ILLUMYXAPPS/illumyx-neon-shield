name: Generate Flutter dependency lockfile

on:
  push:
    branches:
      - feature/family-store-transactional-pairing-integration

permissions:
  contents: write

concurrency:
  group: family-branch-flutter-lockfile
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Resolve and save mobile/pubspec.lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies and generate lockfile
        working-directory: mobile
        run: flutter pub get
      - name: Save generated lockfile through GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s mobile/pubspec.lock
          CONTENT="$(base64 -w 0 mobile/pubspec.lock)"
          FILE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/mobile/pubspec.lock?ref=${GITHUB_REF_NAME}" --jq .sha)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/mobile/pubspec.lock" \
            -f message="Add Flutter dependency lockfile" \
            -f content="$CONTENT" \
            -f sha="$FILE_SHA" \
            -f branch="$GITHUB_REF_NAME"
