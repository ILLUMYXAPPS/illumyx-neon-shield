name: Generate Flutter dependency lockfile

on:
  push:
    branches:
      - feature/family-store-transactional-pairing-integration

permissions:
  contents: read

concurrency:
  group: family-branch-flutter-lockfile
  cancel-in-progress: false

jobs:
  generate-lockfile:
    name: Resolve and export mobile/pubspec.lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies and generate lockfile
        working-directory: mobile
        run: flutter pub get
      - name: Verify generated lockfile
        run: test -s mobile/pubspec.lock
      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: illumyx-mobile-pubspec-lock
          path: mobile/pubspec.lock
          if-no-files-found: error
          retention-days: 7
