name: PostgreSQL Audit-chain Integration

on:
  pull_request:
    paths:
      - "backend/managed_db_store.py"
      - "backend/managed_db_store_test.py"
      - "backend/audit_chain.py"
      - "backend/audit_chain_test.py"
      - "backend/store.py"
      - "backend/production_migrations.py"
      - "backend/migrations.py"
      - "backend/managed_db_postgres_audit_integration_test.py"
      - ".github/workflows/postgres-audit-chain-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-audit-chain-integration:
    name: PostgreSQL 16 audit concurrency, rollback and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neon_test
          POSTGRES_PASSWORD: neon_test_only
          POSTGRES_DB: neon_shield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neon_test -d neon_shield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEON_SHIELD_TEST_DATABASE_URL: postgresql://neon_test:neon_test_only@localhost:5432/neon_shield_test
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install integration-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Compile managed database integration test
        run: python -m compileall -q backend/audit_chain.py backend/audit_chain_test.py backend/store.py backend/managed_db_store.py backend/managed_db_store_test.py backend/migrations.py backend/production_migrations.py backend/managed_db_postgres_audit_integration_test.py
      - name: Run PostgreSQL audit-chain integration tests
        run: python -m unittest backend.managed_db_postgres_audit_integration_test -v
