name: Neon Shield Mobile Checks

on:
  push:
    branches: ["agent/neon-shield-mobile-v1"]
    paths: ["mobile/**", ".github/workflows/mobile-checks.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-checks.yml"]

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
