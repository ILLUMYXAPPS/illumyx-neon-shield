name: Neon Shield Mobile Checks

on:
  workflow_dispatch:
  schedule:
    # Sunday 4:00 pm Brisbane time (06:00 UTC), ahead of the weekly review.
    - cron: "0 6 * * 0"
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"
      - "feat/**"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"
      - ".github/workflows/mobile-signed-release.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"
      - ".github/workflows/mobile-signed-release.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Upload generated lockfile for dependency review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-pubspec-lock
          path: mobile/pubspec.lock
          if-no-files-found: error
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test

  # Temporary, branch-restricted bootstrap: commit only the lockfile generated by pub.
  # Remove this job after the lockfile exists on the PR branch.
  bootstrap-lockfile:
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'chore/dependency-management-policy' }}
    needs: flutter-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chore/dependency-management-policy
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Generate and commit resolved lockfile
        working-directory: mobile
        shell: bash
        run: |
          flutter pub get
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "Lockfile already committed; no changes to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: commit Flutter dependency lockfile"
          git push origin HEAD:chore/dependency-management-policy
