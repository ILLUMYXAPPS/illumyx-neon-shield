name: Neon Shield Mobile Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"
      - "feat/**"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"
      - ".github/workflows/mobile-signed-release.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"
      - ".github/workflows/mobile-signed-release.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
