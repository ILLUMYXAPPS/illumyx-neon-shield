name: Neon Shield Mobile Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"
      - "feat/**"
      - "feature/**"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"
      - ".github/workflows/mobile-signed-release.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"
      - ".github/workflows/mobile-signed-release.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test
